---
# Runs on the live system: /run/archiso is not visible inside the target chroot,
# because Calamares mounts a fresh tmpfs on the target's /run.
dontChroot: true
timeout: 120
script:
    - "/etc/calamares/restore-target-kernel ${ROOT}"

i18n:
    name: "Restoring the kernel on the target system"
    name[ja]: "ターゲットシステムにカーネルを復元しています…"
